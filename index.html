<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KzTv - 免费在线视频搜索与观看平台</title>
    <meta name="description" content="KzTv 是一个免费的多源视频搜索与观看平台，聚合多个公开视频源，无需注册，打开即用。">
    <meta name="keywords" content="在线视频,免费视频,视频搜索,电影,电视剧,KzTv">
    <meta name="author" content="KzTv">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="image/logo.svg">
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/film-grain.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="kt-page kt-grain">

    <div data-chrome="header"></div>

    <!-- ===================== 主体 ===================== -->
    <main class="kt-main">
        <div class="kt-shell">

            <!-- 展厅：文案 + 搜索 + 片源状态板 -->
            <section class="kt-lounge" id="searchArea">
                <div class="kt-lounge-main">
                    <div class="kt-eyebrow" id="ktEyebrow">公开片源 · 实时测速</div>
                    <h1 class="kt-h1">一部片子散在很多地方，<br>我们替你挑<em>最快的那一个</em>。</h1>
                    <p class="kt-lede">不用注册、不用登录。搜索会同时问遍你勾选的所有源，按实测延迟排序，直接给你能马上播的那一个。</p>
                    <div class="kt-search">
                        <input type="text" id="searchInput"
                               placeholder="想看点什么？"
                               autocomplete="off"
                               aria-label="视频搜索框"
                               oninput="toggleClearButton()">
                        <button id="clearSearchInput" type="button"
                                class="kt-icon-btn" style="width:34px;height:34px;border:0"
                                onclick="clearSearchInput()" aria-label="清空搜索框" title="清空搜索框" hidden>
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                        <button onclick="search()" type="button">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                            </svg>搜索
                        </button>
                    </div>
                    <div class="kt-recent" id="recentSearches" aria-label="最近搜索记录"></div>
                </div>

                <aside class="kt-board" id="ktBoard" aria-label="片源状态">
                    <div class="kt-board-head">
                        <span class="t">片源状态</span>
                        <span class="kt-live"><i></i>实时</span>
                    </div>
                    <div class="kt-src-list" id="ktSrcList"></div>
                    <div class="kt-board-foot">
                        <button id="ktBoardFoot" class="kb-toggle" type="button" aria-expanded="false">正在读取…</button>
                        <button id="ktBoardProbe" type="button">重新测速</button>
                    </div>
                </aside>
            </section>

            <!-- 正在热映（最近更新） -->
            <section class="kt-strip hidden" id="latestArea">
                <div class="kt-strip-head">
                    <h3>正在热映</h3>
                    <span class="ln"></span>
                    <span class="hint" id="latestState">近 3 天有更新 · 跨 2 个以上源确认</span>
                    <button id="latest-refresh" class="kt-btn" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>刷新
                    </button>
                </div>
                <div class="kt-hot" id="latest-tags" style="display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px"></div>
                <div class="kt-row" id="latest-results"></div>
                <div class="kt-more" id="latestMore"></div>
            </section>

            <!-- 搜索结果 -->
            <section id="resultsArea" class="hidden">
              <div id="resultsInner">
                <div class="kt-toolbar">
                    <span class="count"><span id="searchResultsCount">0</span> 部影片 · 来自 <span id="searchResultsSources">0</span> 个来源</span>
                    <span class="kt-check" id="searchFailures"></span>
                    <span class="sp"></span>
                    <div class="kt-seg" id="sortSeg" role="group" aria-label="排序方式">
                        <button type="button" data-sort="relevance" class="on">最相关</button>
                        <button type="button" data-sort="time">最新</button>
                        <button type="button" data-sort="sources">源最多</button>
                    </div>
                </div>
                <div class="kt-wall" id="results"></div>
              </div>
            </section>
        </div>
    </main>

    <div data-chrome="panels"></div>

    <div data-chrome="footer"></div>

    <!-- ===================== 节目单（详情 + 选源） ===================== -->
    <aside id="modal" class="kt-prog hidden" aria-label="影片详情与选源">
        <div class="kt-prog-head">
            <span class="t">节目单</span>
            <button onclick="closeModal()" class="kt-icon-btn" type="button" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="kt-prog-body">
            <div id="modalTitle"></div>
            <div id="modalContent"></div>
        </div>
        <div class="kt-prog-cta" id="modalCta"></div>
    </aside>

    <!-- 命令面板（⌘K）：全站只此一份，由 chrome.js 注入 -->
    <div data-chrome="cmd"></div>

    <!-- 使用声明 / 关于我们 / 隐私政策 弹窗：由 js/chrome.js 注入（全站只此一份） -->

    <!-- ===================== 密码验证弹窗 ===================== -->
    <div id="passwordModal" class="kt-modal" hidden>
        <div class="kt-modal-card" style="width:420px" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
            <div class="kt-modal-head">
                <div>
                    <div class="kick">KzTv</div>
                    <h3 id="pwdTitle">访问验证</h3>
                </div>
            </div>
            <div class="kt-modal-body">
                <p style="margin-bottom:12px">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-[var(--kt-raised)] border border-[var(--kt-line)] text-white px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--kt-brand)] transition-colors" placeholder="密码…" autocomplete="new-password">
                    <div class="mt-4 w-full flex space-x-3">
                        <button id="passwordSubmitBtn" type="submit" class="kt-btn pri big flex-1">提交</button>
                        <button id="passwordCancelBtn" type="button" onclick="hidePasswordModal()" class="kt-btn big flex-1">取消</button>
                    </div>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <!-- ===================== 提示 / 加载 ===================== -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 -translate-y-full z-50">
        <p id="toastMessage"></p>
    </div>

    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-[var(--kt-surface)] p-8 rounded-lg border border-[var(--kt-line)] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- JSON-LD 结构化数据 -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KzTv",
        "url": "https://tv.kwokzit.info",
        "description": "KzTv 是一个免费的多源视频搜索与观看平台，聚合多个公开视频源，无需注册，打开即用。",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tv.kwokzit.info/?s={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <script src="js/config.js"></script>
    <script src="js/aggregate.js"></script>
    <script src="js/customer_site.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/password.js"></script>
    <script src="js/search.js"></script>
    <script src="js/source-picker.js"></script>
    <script src="js/board.js"></script>
    <script src="js/cmd.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA 注册 -->
    <script src="js/pwa-register.js"></script>

    <!-- 环境变量注入脚本 -->
    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};

        // 注入服务器端环境变量 (将由服务器端替换)
        // 只注入「身份状态」，绝不注入密码或密码哈希 ——
        // 秘密一旦进了浏览器，它就不再是秘密（哈希可离线爆破，且是可重放的凭据）。
        window.__ENV__.ACCESS_NAME = "{{ACCESS_NAME}}";
        window.__ENV__.AUTH_MODE = "{{AUTH_MODE}}";
    </script>

    <!-- 弹窗和URL搜索参数处理脚本 -->
    <script src="js/index-page.js"></script>
    <script src="js/chrome.js"></script>
</body>
</html>
