<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>KzTv 播放器</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="image/logo.svg">
    <link rel="icon" href="image/logo.png">
    <link rel="apple-touch-icon" href="image/logo-black.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/film-grain.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css">

    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="kt-page kt-grain">

    <div data-chrome="header"></div>

    <!-- ===================== 放映厅 ===================== -->
    <main class="kt-main">
        <div class="kt-shell">
            <!-- 片名 + 返回：放在播放器上方（顶栏只留标识） -->
            <div class="kt-player-head">
                <div class="kt-title-row">
                    <h2 id="videoTitle"></h2>
                    <span id="qualityBadge" class="q-badge" hidden></span>
                </div>
                <a href="#" id="goBack" onclick="goBack(event)" class="kt-btn home-btn" aria-label="返回">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 12H5M11 18l-6-6 6-6"/>
                    </svg>
                    <span class="home-btn-text">返回</span>
                </a>
            </div>

            <div class="kt-hall">

                <div>
                    <!-- 播放器 -->
                    <div id="playerContainer" class="player-container">
                        <div class="relative">
                            <div id="player" class="player-placeholder">
                                <!-- 首屏加载态，等 JS 接管 -->
                                <div class="player-loading-overlay">
                                    <div class="player-loading-spinner"></div>
                                    <div class="player-loading-text" id="loading-title">正在加载视频...</div>
                                </div>
                            </div>
                            <div class="loading-container" id="player-loading" style="display: none;">
                                <div class="loading-spinner"></div>
                                <div>正在加载视频...</div>
                            </div>
                            <div class="error-container" id="error">
                                <div class="error-icon">⚠</div>
                                <div id="error-message">视频加载失败</div>
                                <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                            </div>
                        </div>
                    </div>

                    <!-- 播放器下方：快捷键（居中） → 剧集标题 → 数字按钮独占一行 -->
                    <div class="kt-player-sub">
                        <div class="kt-keys">
                            <span><kbd>←</kbd><kbd>→</kbd>切集</span>
                            <span><kbd>空格</kbd>播放</span>
                            <span><kbd>H</kbd>隐藏界面</span>
                        </div>
                        <div class="kt-hall-foot">
                            <span class="lb">剧集</span>
                            <span id="episodeInfo" class="text-sm text-gray-400">加载中...</span>
                            <span id="episodeSpeed" class="text-xs text-gray-500"></span>
                        </div>
                        <div class="episode-grid" id="episodesGrid" style="max-height:none;overflow:visible">
                            <div class="kt-epgrid" id="episodesList"></div>
                        </div>
                    </div>
                </div>

                <!-- 右侧控制栏 -->
                <aside class="kt-rail">
                    <h5>播放控制</h5>
                    <div id="resourceInfoBarContainer" class="player-container flex justify-between py-2 px-3 mb-3"></div>

                    <div class="flex flex-wrap gap-2">
                        <button onclick="toggleEpisodeOrder()" class="kt-btn" style="height:32px" title="倒序排列">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" id="orderIcon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 002.414 0L11 10.586V7z" clip-rule="evenodd"/>
                            </svg>
                            <span id="orderText">倒序排列</span>
                        </button>
                        <button onclick="copyLinks()" class="kt-btn" style="height:32px" title="复制播放链接">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-2M8 5a2 2 0 002 2h4a2 2 0 002-2M8 5a2 2 0 012-2h4a2 2 0 012 2m4 0h4a2 2 0 012 2v4a2 2 0 01-2 2h-4a2 2 0 01-2-2V7a2 2 0 012-2z"/>
                            </svg>
                        </button>
                        <button id="lockToggle" onclick="toggleControlsLock()" class="kt-btn" style="height:32px" title="锁定控制">
                            <svg id="lockIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11V7a3 3 0 00-6 0v4m-3 4h12v6H6v-6z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="flex gap-2 mt-3">
                        <button onclick="playPreviousEpisode()" id="prevButton" class="kt-btn" style="flex:1">上一集</button>
                        <button onclick="playNextEpisode()" id="nextButton" class="kt-btn" style="flex:1">下一集</button>
                    </div>

                    <!-- 自动连播：放在卡片最下面 -->
                    <div class="kt-rail-auto">
                        <label class="switch" style="margin:0">
                            <input type="checkbox" id="autoplayToggle">
                            <span class="slider"></span>
                        </label>
                        <span class="text-xs text-gray-400">自动连播</span>
                    </div>
                </aside>
            </div>

        </div>
    </main>

    <div data-chrome="footer"></div>

    <!-- 隐藏界面后的恢复按钮（H 键隐藏后出现，点它也能恢复） -->
    <button id="ktUiToggle" class="kt-fab" type="button" onclick="toggleUiHidden()"
            aria-label="显示界面" title="显示界面 (H)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
        显示界面
    </button>

    <!-- 快捷键提示 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="shortcutIcon" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- ===================== 密码验证弹窗 ===================== -->
    <div id="passwordModal" class="kt-modal" hidden>
        <div class="kt-modal-card" style="width:420px" role="dialog" aria-modal="true">
            <div class="kt-modal-head">
                <div>
                    <div class="kick">KzTv</div>
                    <h3>访问验证</h3>
                </div>
            </div>
            <div class="kt-modal-body">
                <p style="margin-bottom:12px">请输入密码继续访问</p>
                <form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;">
                    <input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true">
                    <input type="password" id="passwordInput" class="w-full bg-[var(--kt-raised)] border border-[var(--kt-line)] text-white px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--kt-brand)] transition-colors" placeholder="密码…" autocomplete="new-password">
                    <button id="passwordSubmitBtn" type="submit" class="kt-btn pri big w-full mt-4">提交</button>
                </form>
                <p id="passwordError" class="text-red-500 mt-2 hidden">密码错误，请重试</p>
            </div>
        </div>
    </div>

    <div data-chrome="panels"></div>

    <!-- ===================== 换源 / 选源面板（整屏遮罩，盖住播放器） ===================== -->
    <div id="modal" class="kt-overlay hidden" role="dialog" aria-modal="true" aria-label="选择播放源">
        <div class="kt-overlay-panel">
            <div class="kt-prog-head">
                <span class="t">选择片源</span>
                <button onclick="closeModal()" class="kt-icon-btn" type="button" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <!-- 播放此源卡片：固定在面板顶部，不随源列表滚动 -->
            <div id="sourcePickerTop"></div>
            <div class="kt-prog-body">
                <div id="modalTitle"></div>
                <div id="modalContent"></div>
            </div>
            <div class="kt-prog-cta" id="modalCta"></div>
        </div>
    </div>

    <!-- ===================== 提示 / 加载 ===================== -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 opacity-0 -translate-y-full z-50">
        <p id="toastMessage"></p>
    </div>

    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50">
        <div class="bg-[var(--kt-surface)] p-8 rounded-lg border border-[var(--kt-line)] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <script src="libs/hls.min.js" crossorigin="anonymous"></script>
    <script src="libs/artplayer.min.js" crossorigin="anonymous"></script>

    <script src="js/config.js"></script>
    <script src="js/aggregate.js"></script>
    <script src="js/customer_site.js"></script>
    <script src="js/password.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
    <script src="js/source-picker.js"></script>
    <script src="js/player.js"></script>

    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};

        // 注入服务器端环境变量 (将由服务器端替换)
        // 只注入「身份状态」，绝不注入密码或密码哈希。
        window.__ENV__.ACCESS_NAME = "{{ACCESS_NAME}}";
        window.__ENV__.AUTH_MODE = "{{AUTH_MODE}}";

        // 修复 home 跳转
        document.addEventListener('DOMContentLoaded', function () {
            // 使用事件委托处理首页按钮点击
            document.body.addEventListener('click', function (event) {
                const homeButton = event.target.closest('#homeButton');
                if (homeButton) {
                    event.preventDefault();
                    event.stopPropagation();

                    // 如果是在iframe中打开的，尝试关闭iframe
                    if (window.self !== window.top) {
                        try {
                            // 尝试调用父窗口的关闭播放器函数
                            window.parent.closeVideoPlayer && window.parent.closeVideoPlayer(true);
                            return;
                        } catch (e) {
                            console.error('调用父窗口closeVideoPlayer失败:', e);
                        }
                    }

                    // 多重兜底跳转
                    try {
                            window.location.href = '/';
                    } catch (e) {
                        try {
                            window.location.replace('/');
                    } catch (e2) {
                        window.location.assign('/');
                    }
                    }
                    return false;
                }
            });
        });
    </script>
    <script src="js/chrome.js"></script>
</body>
</html>
